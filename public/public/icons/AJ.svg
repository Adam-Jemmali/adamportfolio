<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="smallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0078D4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0051BA;stop-opacity:1" />
        </linearGradient>

        <filter id="smallGlow">
            <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Outer ring -->
    <circle cx="24" cy="24" r="21" fill="none" stroke="url(#smallGradient)" stroke-width="1.5" filter="url(#smallGlow)"/>

    <!-- Inner ring -->
    <circle cx="24" cy="24" r="19" fill="none" stroke="url(#smallGradient)" stroke-width="0.8" opacity="0.5"/>

    <!-- Letter A -->
    <g transform="translate(10, 10)">
        <path d="M 3 12 L 8 1" stroke="url(#smallGradient)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M 13 12 L 8 1" stroke="url(#smallGradient)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <line x1="4.5" y1="7" x2="11.5" y2="7" stroke="url(#smallGradient)" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Dot -->
    <circle cx="24" cy="26" r="0.8" fill="url(#smallGradient)" filter="url(#smallGlow)"/>

    <!-- Letter J -->
    <g transform="translate(26, 10)">
        <line x1="1.5" y1="0" x2="10" y2="0" stroke="url(#smallGradient)" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M 5.75 0 L 5.75 10 Q 5.75 12 2 12 Q 0 12 0 10" stroke="url(#smallGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>